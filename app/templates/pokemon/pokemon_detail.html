{% extends 'layout.html' %}

{% block content %}
  <div class="container mt-3">
    <h1>{{title}}</h1>
    <hr>
    <div class="row">
      
    </div>
    <div class="row mt-3">
      <div class="col-md-6">
        <img src="{{pokemon.img_url}}" class="img-thumbnail" alt="">
      </div>
      <div class="col-md-6 mt-3 mb-3">
        <h1 class="text-start text-bold">{{pokemon.name}}'s Detail:</h1>
        <h2 class="text-secondary">{{pokemon.description}}</h2>
        <br>
        <h2><b>Weight: </b>{{pokemon.weight}} lbs</h2>
        <h2><b>Height:</b> {{pokemon.height}} "</h2>
        <a href="{{url_for('pokemon')}}" class="btn btn-outline-success mt-5">
          <i class="bi bi-house-heart-fill"></i>
          Back to Home
        </a>
      </div>
    </div>
  </div>
  
{% endblock %}
